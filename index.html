<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Roulette</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f0f4f8;
    color: #333;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 32px; margin-bottom: 4px; }
  .header .subtitle { font-size: 15px; color: #666; }

  .roulette { display: flex; gap: 16px; max-width: 1200px; margin: 0 auto 20px; }
  .col {
    flex: 1; border-radius: 16px; padding: 20px 12px; text-align: center;
    display: flex; flex-direction: column; align-items: center; height: 200px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: box-shadow 0.3s;
  }
  .col.flash { box-shadow: 0 0 20px rgba(255,200,0,0.5); }
  .col-role { background: #d1fae5; }
  .col-verb { background: #fef9c3; }
  .col-mod  { background: #fce7f3; }
  .col-style { background: #e0e7ff; }

  .col-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; opacity: 0.7; }
  .col-word {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; line-height: 1.3; padding: 8px; overflow: hidden;
  }
  .col-word.spinning { animation: pulse 0.08s infinite alternate; }
  @keyframes pulse { to { opacity: 0.6; } }

  .col-btn {
    margin-top: 12px; padding: 8px 20px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; background: rgba(0,0,0,0.08); transition: background 0.2s;
  }
  .col-btn:hover { background: rgba(0,0,0,0.14); }
  .col-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .big-btn-wrap { text-align: center; margin-bottom: 24px; }
  .big-btn {
    padding: 14px 48px; font-size: 22px; font-weight: 700; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer;
    box-shadow: 0 4px 16px rgba(99,102,241,0.35); transition: transform 0.15s, box-shadow 0.15s;
  }
  .big-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
  .big-btn:active { transform: translateY(0); }
  .big-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .prompt-card {
    max-width: 1200px; margin: 0 auto 20px; background: #fff; border-radius: 16px;
    padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .prompt-card h3 { font-size: 15px; margin-bottom: 8px; color: #888; }
  .prompt-combo { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .prompt-edit {
    width: 100%; min-height: 60px; font-size: 14px; color: #555; background: #f8f8fa;
    padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e5e5; font-family: monospace;
    resize: vertical; margin-bottom: 16px; line-height: 1.5;
  }
  .prompt-edit:focus { outline: none; border-color: #8b5cf6; background: #fff; }

  .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn {
    padding: 10px 22px; border: none; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .btn-copy { background: #e0e7ff; color: #4338ca; }
  .btn-copy:hover { background: #c7d2fe; }
  .btn-gen { background: #dcfce7; color: #166534; }
  .btn-gen:hover { background: #bbf7d0; }

  .img-area { max-width: 1200px; margin: 0 auto 20px; text-align: center; display: none; }
  .img-area.visible { display: block; }
  .img-loading { padding: 40px; font-size: 18px; color: #888; }
  .img-area img { max-width: 100%; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

  .panel {
    max-width: 1200px; margin: 0 auto 16px; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden;
  }
  .panel-header {
    padding: 14px 20px; font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; user-select: none;
  }
  .panel-header:hover { background: #fafafa; }
  .panel-header .arrow { transition: transform 0.25s; }
  .panel-header.open .arrow { transform: rotate(90deg); }
  .panel-body { display: none; padding: 0 20px 16px; }
  .panel-body.open { display: block; }

  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; gap: 8px;
  }
  .history-item:hover { background: #f8f8fa; margin: 0 -8px; padding: 8px; border-radius: 8px; }
  .history-item:last-child { border-bottom: none; }
  .history-words { font-size: 14px; font-weight: 600; }
  .history-time { font-size: 12px; color: #999; white-space: nowrap; }
  .history-empty { padding: 12px 0; color: #aaa; font-size: 14px; }
  .clear-btn {
    margin-top: 8px; padding: 6px 16px; border: 1px solid #e5e5e5; border-radius: 8px;
    background: #fff; font-size: 13px; cursor: pointer; color: #999;
  }
  .clear-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

  .wordbank-cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .wb-col { flex: 1; min-width: 200px; }
  .wb-col h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .wb-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 13px; border-bottom: 1px solid #f5f5f5;
  }
  .wb-item span { flex: 1; }
  .wb-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 4px; }
  .wb-del:hover { color: #ef4444; }
  .wb-add-row { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .wb-input { flex: 1; min-width: 80px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  .wb-add-btn {
    padding: 6px 12px; border: none; border-radius: 6px; background: #e0e7ff;
    color: #4338ca; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .wb-add-btn:hover { background: #c7d2fe; }
  .wb-reset {
    margin-top: 12px; padding: 6px 16px; border: 1px solid #e5e5e5; border-radius: 8px;
    background: #fff; font-size: 13px; cursor: pointer; color: #999;
  }
  .wb-reset:hover { background: #fef3c7; color: #92400e; border-color: #fcd34d; }

  .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #aaa; }

  @media (max-width: 640px) {
    .roulette { flex-direction: column; }
    .col { height: 180px; }
    .col-word { font-size: 22px; }
    .big-btn { font-size: 18px; padding: 12px 36px; }
    .action-btns { flex-direction: column; }
    .wordbank-cols { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>&#x1F3B0; AI Prompt Roulette</h1>
  <div class="subtitle">Team Ice Breaker &middot; Spin four columns, generate an image</div>
</div>

<div class="roulette" id="roulette">
  <div class="col col-role" id="col-0">
    <div class="col-title">Who</div>
    <div class="col-word" id="word-0">&mdash;</div>
    <button class="col-btn" onclick="spinOne(0)">&#x1F3B2; Spin</button>
  </div>
  <div class="col col-verb" id="col-1">
    <div class="col-title">Doing What</div>
    <div class="col-word" id="word-1">&mdash;</div>
    <button class="col-btn" onclick="spinOne(1)">&#x1F3B2; Spin</button>
  </div>
  <div class="col col-mod" id="col-2">
    <div class="col-title">How / Where</div>
    <div class="col-word" id="word-2">&mdash;</div>
    <button class="col-btn" onclick="spinOne(2)">&#x1F3B2; Spin</button>
  </div>
  <div class="col col-style" id="col-3">
    <div class="col-title">Style</div>
    <div class="col-word" id="word-3">&mdash;</div>
    <button class="col-btn" onclick="spinOne(3)">&#x1F3B2; Spin</button>
  </div>
</div>

<div class="big-btn-wrap">
  <button class="big-btn" id="bigBtn" onclick="spinAll()">&#x1F3B0; Spin All</button>
</div>

<div class="prompt-card" id="promptCard" style="display:none;">
  <h3>&#x1F4AC; Generated Prompt</h3>
  <div class="prompt-combo" id="promptCombo"></div>
  <textarea class="prompt-edit" id="promptEdit"></textarea>
  <div class="action-btns">
    <button class="action-btn btn-copy" id="copyBtn" onclick="copyPrompt()">&#x1F4CB; Copy Prompt</button>
    <button class="action-btn btn-gen" id="genBtn" onclick="generateImage()">&#x1F3A8; Generate Image</button>
  </div>
</div>

<div class="img-area" id="imgArea">
  <div class="img-loading" id="imgLoading">&#x23F3; Generating image, please wait...</div>
  <img id="genImg" style="display:none;" alt="AI generated image">
</div>

<div class="panel">
  <div class="panel-header" onclick="togglePanel('history')">
    <span>&#x1F4DC; History</span>
    <span class="arrow" id="historyArrow">&#x25B6;</span>
  </div>
  <div class="panel-body" id="historyBody">
    <div id="historyList"></div>
    <button class="clear-btn" onclick="clearHistory()">&#x1F5D1; Clear History</button>
  </div>
</div>

<div class="panel">
  <div class="panel-header" onclick="togglePanel('wordbank')">
    <span>&#x2699;&#xFE0F; Custom Word Bank</span>
    <span class="arrow" id="wordbankArrow">&#x25B6;</span>
  </div>
  <div class="panel-body" id="wordbankBody">
    <div class="wordbank-cols" id="wordbankCols"></div>
    <button class="wb-reset" onclick="resetWordbank()">&#x21BA; Reset to Defaults</button>
  </div>
</div>

<div class="footer">
  Image generation powered by Gemini
</div>

<script>
const NUM_COLS = 4;
const DEFAULT_BANKS = [
  [
    { display: "Lin (Developer)", prompt: "Lin, a developer" },
    { display: "Manuel (Developer)", prompt: "Manuel, a developer" },
    { display: "Timo (Developer)", prompt: "Timo, a developer" },
    { display: "Katharina (PO)", prompt: "Katharina, a product owner" },
    { display: "Serkan (Tech Lead)", prompt: "Serkan, a tech lead" }
  ],
  [
    "refactoring code", "deploying to production", "debugging", "reviewing code",
    "drinking coffee", "hosting a standup", "fixing bugs", "writing documentation",
    "sketching prototypes", "chasing deadlines", "rejecting feature requests",
    "celebrating a launch", "mass deleting code", "arguing about tabs vs spaces",
    "renaming variables", "copy-pasting from Stack Overflow", "fighting merge conflicts",
    "reading error logs", "optimizing queries", "rolling back a release",
    "writing unit tests", "ignoring Slack messages", "attending a retro",
    "presenting a demo"
  ],
  [
    "on the edge of a volcano", "while breakdancing", "wearing a spacesuit",
    "surrounded by curious cats", "floating in the clouds", "riding a unicorn",
    "in the deep ocean", "while eating hotpot", "upside down",
    "in a post-apocalyptic wasteland", "in pajamas", "wielding a lightsaber",
    "on a roller coaster", "inside a giant bubble", "during a thunderstorm",
    "on the moon", "in a haunted house", "while juggling flaming torches",
    "on a flying carpet", "surrounded by penguins", "in zero gravity",
    "wearing a dinosaur costume", "on top of a skyscraper", "in a ball pit"
  ],
  [
    "Pixar style, 3D render, cinematic lighting",
    "watercolor painting, soft brushstrokes",
    "pixel art, retro 16-bit game style",
    "anime style, Studio Ghibli inspired",
    "oil painting, Renaissance masterpiece",
    "cyberpunk neon, digital art",
    "comic book style, bold outlines, halftone dots",
    "low poly 3D, geometric minimal",
    "charcoal sketch, black and white",
    "stained glass window, vibrant colors",
    "claymation, stop motion style",
    "vaporwave aesthetic, pastel gradients",
    "ukiyo-e Japanese woodblock print",
    "pop art, Andy Warhol inspired",
    "isometric illustration, flat design",
    "photorealistic, 8K, ultra detailed",
    "Tim Burton style, gothic whimsical",
    "Monet impressionist, dreamy light",
    "Soviet propaganda poster, bold red",
    "synthwave retro, neon grid sunset",
    "children's book illustration, crayon",
    "blueprint technical drawing, white on blue",
    "Chinese ink wash painting, minimalist",
    "graffiti street art, spray paint",
    "Art Nouveau, ornate flowing lines",
    "LEGO brick scene, toy photography",
    "papercraft diorama, layered cutout",
    "marble sculpture, classical Greek",
    "glitch art, corrupted digital",
    "steampunk Victorian, brass gears",
    "noir film still, dramatic shadows",
    "Bauhaus geometric, primary colors"
  ]
];

const COL_TITLES = ["Who", "Doing What", "How / Where", "Style"];
const STORAGE_KEY_BANKS = "apr_wordbanks_v3";
const STORAGE_KEY_HISTORY = "apr_history_v3";

let banks = loadBanks();
let selected = Array(NUM_COLS).fill(null);
let spinning = Array(NUM_COLS).fill(false);
let history = loadHistory();

function loadBanks() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY_BANKS));
    if (d && d.length === NUM_COLS && Array.isArray(d[0])) return d;
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_BANKS));
}
function saveBanks() { localStorage.setItem(STORAGE_KEY_BANKS, JSON.stringify(banks)); }
function loadHistory() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY));
    if (Array.isArray(d)) return d;
  } catch {}
  return [];
}
function saveHistory() { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); }

let imgDB = null;
function openImgDB() {
  return new Promise((resolve, reject) => {
    if (imgDB) { resolve(imgDB); return; }
    const req = indexedDB.open("apr_images", 1);
    req.onupgradeneeded = () => { req.result.createObjectStore("images"); };
    req.onsuccess = () => { imgDB = req.result; resolve(imgDB); };
    req.onerror = () => reject(req.error);
  });
}
async function saveImage(id, dataUrl) {
  const db = await openImgDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").put(dataUrl, id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function loadImage(id) {
  const db = await openImgDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("images", "readonly");
    const req = tx.objectStore("images").get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function clearImages() {
  const db = await openImgDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function displayText(col, item) { return col === 0 ? item.display : item; }
function promptText(col, item) { return col === 0 ? item.prompt : item; }

function spinOne(col) {
  if (spinning[col] || banks[col].length === 0) return;
  spinning[col] = true;
  disableButtons();
  const wordEl = document.getElementById("word-" + col);
  wordEl.classList.add("spinning");
  const duration = 800 + Math.random() * 400;
  const start = Date.now();
  const iv = setInterval(() => {
    wordEl.textContent = displayText(col, randItem(banks[col]));
    if (Date.now() - start >= duration) {
      clearInterval(iv);
      const pick = randItem(banks[col]);
      selected[col] = pick;
      wordEl.textContent = displayText(col, pick);
      wordEl.classList.remove("spinning");
      flashCol(col);
      spinning[col] = false;
      disableButtons();
      updatePrompt();
    }
  }, 80);
}

function spinAll() {
  if (spinning.some(Boolean)) return;
  for (let i = 0; i < NUM_COLS; i++) spinning[i] = true;
  disableButtons();
  const durations = [800 + Math.random() * 400];
  for (let i = 1; i < NUM_COLS; i++) durations[i] = durations[i - 1] + 200;
  for (let col = 0; col < NUM_COLS; col++) {
    const wordEl = document.getElementById("word-" + col);
    wordEl.classList.add("spinning");
    const start = Date.now();
    const iv = setInterval(() => {
      wordEl.textContent = displayText(col, randItem(banks[col]));
      if (Date.now() - start >= durations[col]) {
        clearInterval(iv);
        const pick = randItem(banks[col]);
        selected[col] = pick;
        wordEl.textContent = displayText(col, pick);
        wordEl.classList.remove("spinning");
        flashCol(col);
        spinning[col] = false;
        disableButtons();
        if (col === NUM_COLS - 1) { updatePrompt(); addHistory(); }
      }
    }, 80);
  }
}

function flashCol(col) {
  const el = document.getElementById("col-" + col);
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 400);
}

function disableButtons() {
  const any = spinning.some(Boolean);
  document.getElementById("bigBtn").disabled = any;
  document.querySelectorAll(".col-btn").forEach((b, i) => { b.disabled = spinning[i]; });
}

function updatePrompt() {
  const card = document.getElementById("promptCard");
  if (selected.some(s => !s)) { card.style.display = "none"; return; }
  card.style.display = "";
  document.getElementById("promptCombo").textContent = selected.map((s, i) => displayText(i, s)).join(" + ");
  const en = promptText(0, selected[0]) + " is " + selected[1] + " " + selected[2] + ", " + selected[3] + ", humorous, highly detailed";
  document.getElementById("promptEdit").value = en;
}

function getEditedPrompt() {
  return document.getElementById("promptEdit").value;
}

function copyPrompt() {
  navigator.clipboard.writeText(getEditedPrompt()).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "\u2713 Copied!";
    setTimeout(() => { btn.textContent = "\uD83D\uDCCB Copy Prompt"; }, 1500);
  });
}

async function generateImage() {
  const area = document.getElementById("imgArea");
  const img = document.getElementById("genImg");
  const loading = document.getElementById("imgLoading");
  const genBtn = document.getElementById("genBtn");
  genBtn.disabled = true;
  area.classList.add("visible");
  img.style.display = "none";
  loading.style.display = "";
  loading.textContent = "\u23F3 Generating image, please wait...";
  const targetId = history.length > 0 ? history[0].id : null;
  try {
    const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=AIzaSyBhSENSNxmAZVjZN2PqTyfJ6mstVTa6dgo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: "Generate an image: " + getEditedPrompt() }] }],
        generationConfig: { responseModalities: ["IMAGE", "TEXT"] }
      })
    });
    if (!resp.ok) throw new Error("API error: " + resp.status);
    const data = await resp.json();
    const parts = data.candidates?.[0]?.content?.parts || [];
    const imgPart = parts.find(p => p.inlineData);
    if (!imgPart) throw new Error("No image returned");
    const dataUrl = "data:" + imgPart.inlineData.mimeType + ";base64," + imgPart.inlineData.data;
    img.src = dataUrl;
    loading.style.display = "none";
    img.style.display = "";
    if (targetId) {
      const entry = history.find(h => h.id === targetId);
      if (entry) {
        entry.hasImage = true;
        saveHistory();
        saveImage(targetId, dataUrl).catch(() => {});
        renderHistory();
      }
    }
  } catch (e) {
    loading.textContent = "\u26A0\uFE0F " + e.message;
  } finally {
    genBtn.disabled = false;
  }
}

function addHistory() {
  if (selected.some(s => !s)) return;
  const entry = { id: Date.now().toString(), words: selected.slice(), time: new Date().toLocaleString("en-US", { hour12: false }), hasImage: false };
  history.unshift(entry);
  if (history.length > 20) {
    const evicted = history.pop();
    if (evicted.hasImage && evicted.id) {
      openImgDB().then(db => {
        const tx = db.transaction("images", "readwrite");
        tx.objectStore("images").delete(evicted.id);
      }).catch(() => {});
    }
  }
  saveHistory();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  if (history.length === 0) { list.innerHTML = '<div class="history-empty">No records yet</div>'; return; }
  list.innerHTML = history.map((h, i) =>
    '<div class="history-item" onclick="restoreHistory(' + i + ')">' +
    '<span class="history-words">' + (h.hasImage ? '\uD83D\uDDBC\uFE0F ' : '') + h.words.map((w, c) => esc(displayText(c, w))).join(" + ") + '</span>' +
    '<span class="history-time">' + h.time + '</span></div>'
  ).join("");
}

async function restoreHistory(i) {
  const h = history[i];
  selected = h.words.slice();
  for (let c = 0; c < NUM_COLS; c++) {
    document.getElementById("word-" + c).textContent = displayText(c, selected[c]);
    flashCol(c);
  }
  updatePrompt();
  const area = document.getElementById("imgArea");
  const img = document.getElementById("genImg");
  const loading = document.getElementById("imgLoading");
  if (h.hasImage && h.id) {
    const dataUrl = await loadImage(h.id).catch(() => null);
    if (dataUrl) {
      area.classList.add("visible");
      img.src = dataUrl;
      img.style.display = "";
      loading.style.display = "none";
    } else {
      area.classList.remove("visible");
    }
  } else {
    area.classList.remove("visible");
  }
}

function clearHistory() { if (!confirm("Clear all history and saved images?")) return; history = []; saveHistory(); renderHistory(); clearImages().catch(() => {}); }

function togglePanel(name) {
  const body = document.getElementById(name + "Body");
  const arrow = document.getElementById(name + "Arrow");
  const header = arrow.parentElement;
  const open = body.classList.toggle("open");
  header.classList.toggle("open", open);
}

function renderWordbank() {
  const container = document.getElementById("wordbankCols");
  container.innerHTML = banks.map((bank, col) =>
    '<div class="wb-col"><h4>' + COL_TITLES[col] + '</h4>' +
    bank.map((w, j) =>
      '<div class="wb-item"><span>' + esc(displayText(col, w)) + '</span>' +
      '<button class="wb-del" onclick="delWord(' + col + ',' + j + ')">\u2715</button></div>'
    ).join("") +
    '<div class="wb-add-row">' +
    (col === 0
      ? '<input class="wb-input" id="wbIn' + col + 'name" placeholder="Name" onkeydown="if(event.key===\'Enter\')addWord(' + col + ')">' +
        '<input class="wb-input" id="wbIn' + col + 'role" placeholder="Role" onkeydown="if(event.key===\'Enter\')addWord(' + col + ')">'
      : '<input class="wb-input" id="wbIn' + col + '" placeholder="Add new word..." onkeydown="if(event.key===\'Enter\')addWord(' + col + ')">') +
    '<button class="wb-add-btn" onclick="addWord(' + col + ')">Add</button>' +
    '</div></div>'
  ).join("");
}

function delWord(col, idx) { banks[col].splice(idx, 1); saveBanks(); renderWordbank(); }

function addWord(col) {
  if (col === 0) {
    const name = document.getElementById("wbIn0name").value.trim();
    const role = document.getElementById("wbIn0role").value.trim();
    if (!name || !role) return;
    banks[0].push({ display: name + " (" + role + ")", prompt: name + ", a " + role.toLowerCase() });
  } else {
    const v = document.getElementById("wbIn" + col).value.trim();
    if (!v) return;
    banks[col].push(v);
  }
  saveBanks();
  renderWordbank();
}

function resetWordbank() { banks = JSON.parse(JSON.stringify(DEFAULT_BANKS)); saveBanks(); renderWordbank(); }

renderHistory();
renderWordbank();
</script>
</body>
</html>
