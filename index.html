<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Roulette</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f0f4f8;
    color: #333;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 32px; margin-bottom: 4px; }
  .header .subtitle { font-size: 15px; color: #666; }

  /* Roulette columns */
  .roulette { display: flex; gap: 16px; max-width: 900px; margin: 0 auto 20px; }
  .col {
    flex: 1;
    border-radius: 16px;
    padding: 20px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 200px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: box-shadow 0.3s;
  }
  .col.flash { box-shadow: 0 0 20px rgba(255,200,0,0.5); }
  .col-role { background: #d1fae5; }
  .col-verb { background: #fef9c3; }
  .col-mod  { background: #fce7f3; }

  .col-title {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    opacity: 0.7;
  }
  .col-word {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.3;
    padding: 8px;
    min-height: 80px;
    transition: transform 0.15s;
  }
  .col-word.spinning { animation: pulse 0.08s infinite alternate; }
  @keyframes pulse { to { opacity: 0.6; } }

  .col-btn {
    margin-top: 12px;
    padding: 8px 20px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: rgba(0,0,0,0.08);
    transition: background 0.2s;
  }
  .col-btn:hover { background: rgba(0,0,0,0.14); }
  .col-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Big button */
  .big-btn-wrap { text-align: center; margin-bottom: 24px; }
  .big-btn {
    padding: 14px 48px;
    font-size: 22px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .big-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
  .big-btn:active { transform: translateY(0); }
  .big-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Prompt card */
  .prompt-card {
    max-width: 900px;
    margin: 0 auto 20px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .prompt-card h3 { font-size: 15px; margin-bottom: 8px; color: #888; }
  .prompt-zh { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .prompt-en { font-size: 14px; color: #555; background: #f8f8fa; padding: 10px 14px; border-radius: 8px; word-break: break-word; margin-bottom: 16px; font-family: monospace; }

  .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn {
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-copy { background: #e0e7ff; color: #4338ca; }
  .btn-copy:hover { background: #c7d2fe; }
  .btn-gen { background: #dcfce7; color: #166534; }
  .btn-gen:hover { background: #bbf7d0; }

  /* Generated image */
  .img-area {
    max-width: 900px;
    margin: 0 auto 20px;
    text-align: center;
    display: none;
  }
  .img-area.visible { display: block; }
  .img-loading { padding: 40px; font-size: 18px; color: #888; }
  .img-area img {
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  /* History panel */
  .panel {
    max-width: 900px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .panel-header:hover { background: #fafafa; }
  .panel-header .arrow { transition: transform 0.25s; }
  .panel-header.open .arrow { transform: rotate(90deg); }
  .panel-body { display: none; padding: 0 20px 16px; }
  .panel-body.open { display: block; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    gap: 8px;
  }
  .history-item:hover { background: #f8f8fa; margin: 0 -8px; padding: 8px; border-radius: 8px; }
  .history-item:last-child { border-bottom: none; }
  .history-words { font-size: 14px; font-weight: 600; }
  .history-time { font-size: 12px; color: #999; white-space: nowrap; }
  .history-empty { padding: 12px 0; color: #aaa; font-size: 14px; }
  .clear-btn {
    margin-top: 8px;
    padding: 6px 16px;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #999;
  }
  .clear-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

  /* Custom wordbank panel */
  .wordbank-cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .wb-col { flex: 1; min-width: 220px; }
  .wb-col h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .wb-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid #f5f5f5;
  }
  .wb-item span { flex: 1; }
  .wb-del {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
  }
  .wb-del:hover { color: #ef4444; }
  .wb-add-row { display: flex; gap: 4px; margin-top: 8px; }
  .wb-input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
  }
  .wb-add-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #e0e7ff;
    color: #4338ca;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .wb-add-btn:hover { background: #c7d2fe; }
  .wb-reset {
    margin-top: 12px;
    padding: 6px 16px;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #999;
  }
  .wb-reset:hover { background: #fef3c7; color: #92400e; border-color: #fcd34d; }

  /* Footer */
  .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #aaa; }

  /* Responsive */
  @media (max-width: 640px) {
    .roulette { flex-direction: column; }
    .col { min-height: 140px; }
    .col-word { font-size: 22px; }
    .big-btn { font-size: 18px; padding: 12px 36px; }
    .action-btns { flex-direction: column; }
    .wordbank-cols { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>&#x1F3B0; AI Prompt Roulette</h1>
  <div class="subtitle">&#x56E2;&#x961F; Ice Breaker &middot; &#x4E09;&#x680F;&#x968F;&#x673A;&#x62BD;&#x8BCD;&#x751F;&#x56FE;</div>
</div>

<div class="roulette" id="roulette">
  <div class="col col-role" id="col-0">
    <div class="col-title">&#x8C01;</div>
    <div class="col-word" id="word-0">&#x2014;</div>
    <button class="col-btn" onclick="spinOne(0)">&#x1F3B2; &#x62BD;</button>
  </div>
  <div class="col col-verb" id="col-1">
    <div class="col-title">&#x5728;&#x505A;&#x4EC0;&#x4E48;</div>
    <div class="col-word" id="word-1">&#x2014;</div>
    <button class="col-btn" onclick="spinOne(1)">&#x1F3B2; &#x62BD;</button>
  </div>
  <div class="col col-mod" id="col-2">
    <div class="col-title">&#x600E;&#x4E48;&#x505A;</div>
    <div class="col-word" id="word-2">&#x2014;</div>
    <button class="col-btn" onclick="spinOne(2)">&#x1F3B2; &#x62BD;</button>
  </div>
</div>

<div class="big-btn-wrap">
  <button class="big-btn" id="bigBtn" onclick="spinAll()">&#x1F3B0; &#x5168;&#x90E8;&#x968F;&#x673A;</button>
</div>

<div class="prompt-card" id="promptCard" style="display:none;">
  <h3>&#x1F4AC; &#x751F;&#x6210;&#x7684; Prompt</h3>
  <div class="prompt-zh" id="promptZh"></div>
  <div class="prompt-en" id="promptEn"></div>
  <div class="action-btns">
    <button class="action-btn btn-copy" id="copyBtn" onclick="copyPrompt()">&#x1F4CB; &#x590D;&#x5236; prompt</button>
    <button class="action-btn btn-gen" id="genBtn" onclick="generateImage()">&#x1F3A8; &#x76F4;&#x63A5;&#x751F;&#x56FE;</button>
  </div>
</div>

<div class="img-area" id="imgArea">
  <div class="img-loading" id="imgLoading">&#x23F3; &#x56FE;&#x7247;&#x751F;&#x6210;&#x4E2D;&#xFF0C;&#x8BF7;&#x7A0D;&#x5019;...</div>
  <img id="genImg" style="display:none;" alt="AI generated image">
</div>

<!-- History -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel('history')">
    <span>&#x1F4DC; &#x672C;&#x573A;&#x6218;&#x7EE9;</span>
    <span class="arrow" id="historyArrow">&#x25B6;</span>
  </div>
  <div class="panel-body" id="historyBody">
    <div id="historyList"></div>
    <button class="clear-btn" onclick="clearHistory()">&#x1F5D1; &#x6E05;&#x7A7A;&#x8BB0;&#x5F55;</button>
  </div>
</div>

<!-- Custom wordbank -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel('wordbank')">
    <span>&#x2699;&#xFE0F; &#x81EA;&#x5B9A;&#x4E49;&#x8BCD;&#x5E93;</span>
    <span class="arrow" id="wordbankArrow">&#x25B6;</span>
  </div>
  <div class="panel-body" id="wordbankBody">
    <div class="wordbank-cols" id="wordbankCols"></div>
    <button class="wb-reset" onclick="resetWordbank()">&#x21BA; &#x6062;&#x590D;&#x9ED8;&#x8BA4;&#x8BCD;&#x5E93;</button>
  </div>
</div>

<div class="footer">
  &#x751F;&#x56FE;&#x670D;&#x52A1;&#x7531; Pollinations.ai &#x63D0;&#x4F9B; &middot; &#x5B8C;&#x5168;&#x514D;&#x8D39;
</div>

<script>
// === Default word banks ===
const DEFAULT_BANKS = [
  [
    { zh: "后端工程师", en: "backend engineer" },
    { zh: "前端工程师", en: "frontend engineer" },
    { zh: "产品经理", en: "product manager" },
    { zh: "设计师", en: "designer" },
    { zh: "Scrum Master", en: "scrum master" },
    { zh: "测试工程师", en: "QA engineer" },
    { zh: "实习生", en: "intern" },
    { zh: "技术总监", en: "CTO" },
    { zh: "DevOps", en: "DevOps engineer" },
    { zh: "数据分析师", en: "data analyst" }
  ],
  [
    { zh: "重构代码", en: "refactoring code" },
    { zh: "部署上线", en: "deploying to production" },
    { zh: "调试程序", en: "debugging" },
    { zh: "评审代码", en: "reviewing code" },
    { zh: "喝咖啡", en: "drinking coffee" },
    { zh: "开站会", en: "hosting a standup" },
    { zh: "修 bug", en: "fixing bugs" },
    { zh: "写文档", en: "writing documentation" },
    { zh: "画原型", en: "sketching prototypes" },
    { zh: "推进度", en: "chasing deadlines" },
    { zh: "拒绝需求", en: "rejecting feature requests" },
    { zh: "庆祝上线", en: "celebrating a launch" }
  ],
  [
    { zh: "在火山口", en: "on the edge of a volcano" },
    { zh: "一边跳街舞", en: "while breakdancing" },
    { zh: "戴着宇航服", en: "wearing a spacesuit" },
    { zh: "被一群猫围观", en: "surrounded by curious cats" },
    { zh: "在云端漂浮", en: "floating in the clouds" },
    { zh: "骑着独角兽", en: "riding a unicorn" },
    { zh: "在深海里", en: "in the deep ocean" },
    { zh: "边吃火锅", en: "while eating hotpot" },
    { zh: "倒立着", en: "upside down" },
    { zh: "在末日废墟里", en: "in a post-apocalyptic wasteland" },
    { zh: "穿着睡衣", en: "in pajamas" },
    { zh: "用激光剑", en: "wielding a lightsaber" }
  ]
];

const COL_TITLES = ["谁", "在做什么", "怎么做"];
const STORAGE_KEY_BANKS = "apr_wordbanks";
const STORAGE_KEY_HISTORY = "apr_history";

let banks = loadBanks();
let selected = [null, null, null];
let spinning = [false, false, false];
let history = loadHistory();

// === Storage ===
function loadBanks() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY_BANKS));
    if (d && d.length === 3) return d;
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_BANKS));
}
function saveBanks() { localStorage.setItem(STORAGE_KEY_BANKS, JSON.stringify(banks)); }
function loadHistory() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY));
    if (Array.isArray(d)) return d;
  } catch {}
  return [];
}
function saveHistory() { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); }

// === Random ===
function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// === Spin single column ===
function spinOne(col) {
  if (spinning[col] || banks[col].length === 0) return;
  spinning[col] = true;
  disableButtons();
  const wordEl = document.getElementById("word-" + col);
  wordEl.classList.add("spinning");

  const duration = 800 + Math.random() * 400;
  const start = Date.now();
  const iv = setInterval(() => {
    wordEl.textContent = randItem(banks[col]).zh;
    if (Date.now() - start >= duration) {
      clearInterval(iv);
      const pick = randItem(banks[col]);
      selected[col] = pick;
      wordEl.textContent = pick.zh;
      wordEl.classList.remove("spinning");
      flashCol(col);
      spinning[col] = false;
      disableButtons();
      updatePrompt();
    }
  }, 80);
}

// === Spin all ===
function spinAll() {
  if (spinning.some(Boolean)) return;
  [0, 1, 2].forEach(i => { spinning[i] = true; });
  disableButtons();
  const durations = [800 + Math.random() * 400, 0, 0];
  durations[1] = durations[0] + 200;
  durations[2] = durations[1] + 200;

  [0, 1, 2].forEach(col => {
    const wordEl = document.getElementById("word-" + col);
    wordEl.classList.add("spinning");
    const start = Date.now();
    const iv = setInterval(() => {
      wordEl.textContent = randItem(banks[col]).zh;
      if (Date.now() - start >= durations[col]) {
        clearInterval(iv);
        const pick = randItem(banks[col]);
        selected[col] = pick;
        wordEl.textContent = pick.zh;
        wordEl.classList.remove("spinning");
        flashCol(col);
        spinning[col] = false;
        disableButtons();
        if (col === 2) {
          updatePrompt();
          addHistory();
        }
      }
    }, 80);
  });
}

function flashCol(col) {
  const el = document.getElementById("col-" + col);
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 400);
}

function disableButtons() {
  const any = spinning.some(Boolean);
  document.getElementById("bigBtn").disabled = any;
  document.querySelectorAll(".col-btn").forEach((b, i) => { b.disabled = spinning[i]; });
}

// === Prompt ===
function updatePrompt() {
  const card = document.getElementById("promptCard");
  if (!selected[0] || !selected[1] || !selected[2]) { card.style.display = "none"; return; }
  card.style.display = "";
  document.getElementById("promptZh").textContent = selected[0].zh + " + " + selected[1].zh + " + " + selected[2].zh;
  const en = "A " + selected[0].en + " is " + selected[1].en + " " + selected[2].en + ", Pixar style, 3D render, cinematic lighting, humorous, highly detailed";
  document.getElementById("promptEn").textContent = en;
}

function getEnPrompt() {
  return "A " + selected[0].en + " is " + selected[1].en + " " + selected[2].en + ", Pixar style, 3D render, cinematic lighting, humorous, highly detailed";
}

// === Copy ===
function copyPrompt() {
  const text = getEnPrompt();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "\u2713 \u5DF2\u590D\u5236";
    setTimeout(() => { btn.textContent = "\uD83D\uDCCB \u590D\u5236 prompt"; }, 1500);
  });
}

// === Generate image ===
function generateImage() {
  const area = document.getElementById("imgArea");
  const img = document.getElementById("genImg");
  const loading = document.getElementById("imgLoading");
  area.classList.add("visible");
  img.style.display = "none";
  loading.style.display = "";
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(getEnPrompt()) + "?width=768&height=768&nologo=true&seed=" + Math.floor(Math.random() * 100000);
  img.onload = () => { loading.style.display = "none"; img.style.display = ""; };
  img.onerror = () => { loading.textContent = "\u26A0\uFE0F \u56FE\u7247\u52A0\u8F7D\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5"; };
  img.src = url;
}

// === History ===
function addHistory() {
  if (!selected[0] || !selected[1] || !selected[2]) return;
  const entry = {
    words: [selected[0], selected[1], selected[2]],
    time: new Date().toLocaleString("zh-CN", { hour12: false })
  };
  history.unshift(entry);
  if (history.length > 20) history.pop();
  saveHistory();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">\u8FD8\u6CA1\u6709\u8BB0\u5F55</div>';
    return;
  }
  list.innerHTML = history.map((h, i) =>
    '<div class="history-item" onclick="restoreHistory(' + i + ')">' +
    '<span class="history-words">' + h.words[0].zh + " + " + h.words[1].zh + " + " + h.words[2].zh + '</span>' +
    '<span class="history-time">' + h.time + '</span></div>'
  ).join("");
}

function restoreHistory(i) {
  const h = history[i];
  selected = [h.words[0], h.words[1], h.words[2]];
  [0, 1, 2].forEach(c => {
    document.getElementById("word-" + c).textContent = selected[c].zh;
    flashCol(c);
  });
  updatePrompt();
}

function clearHistory() {
  history = [];
  saveHistory();
  renderHistory();
}

// === Panel toggle ===
function togglePanel(name) {
  const body = document.getElementById(name + "Body");
  const arrow = document.getElementById(name + "Arrow");
  const header = arrow.parentElement;
  const open = body.classList.toggle("open");
  header.classList.toggle("open", open);
}

// === Wordbank UI ===
function renderWordbank() {
  const container = document.getElementById("wordbankCols");
  container.innerHTML = banks.map((bank, col) =>
    '<div class="wb-col">' +
    '<h4>' + COL_TITLES[col] + '</h4>' +
    bank.map((w, j) =>
      '<div class="wb-item"><span>' + w.zh + ' / ' + w.en + '</span>' +
      '<button class="wb-del" onclick="delWord(' + col + ',' + j + ')">\u2715</button></div>'
    ).join("") +
    '<div class="wb-add-row">' +
    '<input class="wb-input" id="wbZh' + col + '" placeholder="\u4E2D\u6587">' +
    '<input class="wb-input" id="wbEn' + col + '" placeholder="English">' +
    '<button class="wb-add-btn" onclick="addWord(' + col + ')">\u6DFB\u52A0</button>' +
    '</div></div>'
  ).join("");
}

function delWord(col, idx) {
  banks[col].splice(idx, 1);
  saveBanks();
  renderWordbank();
}

function addWord(col) {
  const zh = document.getElementById("wbZh" + col).value.trim();
  const en = document.getElementById("wbEn" + col).value.trim();
  if (!zh || !en) return;
  banks[col].push({ zh, en });
  saveBanks();
  renderWordbank();
}

function resetWordbank() {
  banks = JSON.parse(JSON.stringify(DEFAULT_BANKS));
  saveBanks();
  renderWordbank();
}

// === Init ===
renderHistory();
renderWordbank();
</script>
</body>
</html>
